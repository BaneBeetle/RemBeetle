<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>RemAI</title>
    <link rel="icon" type="image/jpeg" href="./rem.jpg">
    <!--
      Backend origin config. Sets window.REMAI_BACKEND_ORIGIN when this frontend is hosted
      separately from the backend (Vercel). Leave it null when the backend serves this page.
      On Vercel, vercel-build.sh generates dist/config.js from the REMAI_BACKEND_ORIGIN env var.
    -->
    <script src="./config.js"></script>
    <script>
      // Rewrite WebSocket and HTTP requests from the hardcoded 127.0.0.1:12393 to the backend origin
      // This fixes the issue where frontend tries to connect to localhost when accessed remotely
      (function() {
        // ---- Backend origin resolution (RemBeetle) -------------------------------------
        // The compiled React bundle hardcodes http://127.0.0.1:12393 and ws://127.0.0.1:12393.
        // Every request is rewritten at runtime to the real backend origin:
        //   * window.REMAI_BACKEND_ORIGIN (set in ./config.js) when the frontend is hosted
        //     separately from the backend, e.g. Vercel -> https://api.rembeetle.com
        //   * otherwise the page's own origin, i.e. the backend is serving this page itself
        //     (EC2 behind Caddy, or http://localhost:12393 in development). This keeps the
        //     historical same-origin behaviour exactly as it was.
        const configuredBackend =
          (typeof window.REMAI_BACKEND_ORIGIN === 'string' && window.REMAI_BACKEND_ORIGIN.trim())
            ? window.REMAI_BACKEND_ORIGIN.trim().replace(/\/+$/, '')
            : '';
        const backendOrigin = configuredBackend || window.location.origin;   // e.g. "https://api.rembeetle.com"
        const backendWsOrigin = backendOrigin.replace(/^http/, 'ws');         // "https://" -> "wss://", "http://" -> "ws://"
        window.__REMAI_RESOLVED_BACKEND_ORIGIN = backendOrigin;               // read by auth-shell.js
        if (window.location.protocol === 'https:' && backendOrigin.indexOf('http://') === 0) {
          console.warn('[backend-origin] page is https but the backend origin is http; browsers block this as mixed content:', backendOrigin);
        }

        // Helper function to replace the bundle's hardcoded localhost URLs with the backend origin
        const replaceLocalhost = function(url) {
          if (typeof url !== 'string') return url;
          url = url.replace(/http:\/\/127\.0\.0\.1:12393/g, backendOrigin);
          url = url.replace(/http:\/\/localhost:12393/g, backendOrigin);
          return url;
        };

        // Override WebSocket constructor with message queuing
        const originalWebSocket = window.WebSocket;
        window.WebSocket = function(url, protocols) {
          if (url && typeof url === 'string') {
            url = url.replace(/^ws:\/\/127\.0\.0\.1:12393/, backendWsOrigin);
            url = url.replace(/^ws:\/\/localhost:12393/, backendWsOrigin);
            url = url.replace(/\s+\//, '/');
          }

          const ws = new originalWebSocket(url, protocols);
          
          // Message queue for messages sent before connection is open
          const messageQueue = [];
          
          // Store original send
          const originalSend = ws.send.bind(ws);
          
          // Override send to queue messages if not open
          ws.send = function(data) {
            if (ws.readyState === WebSocket.OPEN) {
              originalSend(data);
            } else if (ws.readyState === WebSocket.CONNECTING) {
              console.log('[WS Queue] Queuing message, connection not ready yet');
              messageQueue.push(data);
            } else {
              console.warn('[WS Queue] Cannot send, WebSocket state:', ws.readyState);
            }
          };
          
          // When connection opens, send queued messages
          ws.addEventListener('open', function() {
            console.log('[WS Queue] Connection opened, sending', messageQueue.length, 'queued messages');
            while (messageQueue.length > 0) {
              const msg = messageQueue.shift();
              originalSend(msg);
            }
          });
          
          return ws;
        };
        
        // Copy static constants from original WebSocket
        window.WebSocket.CONNECTING = originalWebSocket.CONNECTING;
        window.WebSocket.OPEN = originalWebSocket.OPEN;
        window.WebSocket.CLOSING = originalWebSocket.CLOSING;
        window.WebSocket.CLOSED = originalWebSocket.CLOSED;
        window.WebSocket.prototype = originalWebSocket.prototype;
        
        // Override fetch to replace localhost URLs
        const originalFetch = window.fetch;
        window.fetch = function(input, init) {
          if (typeof input === 'string') {
            input = replaceLocalhost(input);
          } else if (input instanceof Request) {
            // If input is a Request object, we need to create a new one with modified URL
            const newUrl = replaceLocalhost(input.url);
            if (newUrl !== input.url) {
              input = new Request(newUrl, {
                method: input.method,
                headers: input.headers,
                body: input.body,
                mode: input.mode,
                credentials: input.credentials,
                cache: input.cache,
                redirect: input.redirect,
                referrer: input.referrer,
                integrity: input.integrity
              });
            }
          }
          return originalFetch(input, init);
        };
        
        // Override XMLHttpRequest to replace localhost URLs
        const originalXHROpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function(method, url, ...rest) {
          url = replaceLocalhost(url);
          return originalXHROpen.call(this, method, url, ...rest);
        };
        
        // Override Image constructor to replace localhost URLs
        const originalImage = window.Image;
        window.Image = function(...args) {
          const img = new originalImage(...args);
          // Intercept src property assignment
          const originalSrcDescriptor = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
          let interceptedSrc = null;
          
          Object.defineProperty(img, 'src', {
            get: function() {
              return interceptedSrc || originalSrcDescriptor.get.call(this);
            },
            set: function(value) {
              interceptedSrc = replaceLocalhost(value);
              originalSrcDescriptor.set.call(this, interceptedSrc);
            },
            configurable: true,
            enumerable: true
          });
          
          if (args[0] && typeof args[0] === 'string') {
            img.src = args[0]; // This will trigger our setter
          }
          return img;
        };
        
        // Intercept image src attribute assignments
        const originalSetAttribute = Element.prototype.setAttribute;
        Element.prototype.setAttribute = function(name, value) {
          if ((name === 'src' || name === 'data-src') && typeof value === 'string') {
            value = replaceLocalhost(value);
          }
          return originalSetAttribute.call(this, name, value);
        };
        
        // Intercept style.backgroundImage assignments
        try {
          const originalStyleSetter = Object.getOwnPropertyDescriptor(CSSStyleDeclaration.prototype, 'backgroundImage').set;
          Object.defineProperty(CSSStyleDeclaration.prototype, 'backgroundImage', {
            set: function(value) {
              if (typeof value === 'string') {
                value = replaceLocalhost(value);
              }
              return originalStyleSetter.call(this, value);
            },
            get: Object.getOwnPropertyDescriptor(CSSStyleDeclaration.prototype, 'backgroundImage').get,
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Ignore if we can't intercept this
        }
        
        // Use MutationObserver to catch image src changes after DOM manipulation
        const observer = new MutationObserver(function(mutations) {
          mutations.forEach(function(mutation) {
            if (mutation.type === 'attributes' && mutation.attributeName === 'src') {
              const target = mutation.target;
              if (target.tagName === 'IMG' && target.src) {
                const newSrc = replaceLocalhost(target.src);
                if (newSrc !== target.src) {
                  target.src = newSrc;
                }
              }
            }
            // Also check for style changes that might contain background images
            if (mutation.type === 'attributes' && mutation.attributeName === 'style') {
              const target = mutation.target;
              const bgImage = target.style.backgroundImage;
              if (bgImage && typeof bgImage === 'string') {
                const newBg = replaceLocalhost(bgImage);
                if (newBg !== bgImage) {
                  target.style.backgroundImage = newBg;
                }
              }
            }
          });
        });
        
        // Start observing when DOM is ready
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function() {
            observer.observe(document.body, {
              attributes: true,
              attributeFilter: ['src', 'style'],
              subtree: true
            });
          });
        } else {
          observer.observe(document.body, {
            attributes: true,
            attributeFilter: ['src', 'style'],
            subtree: true
          });
        }
      })();
    </script>
    <!--
      Auth shell: fetches /api/config, lazy-loads Supabase SDK, wraps
      window.WebSocket to inject ?token=<jwt> on /client-ws connections.
      Loaded AFTER the URL rewriter so its wrapper sits on top of the
      rewriter's wrapper — both transformations compose cleanly.
      Total no-op when /api/config returns auth_enabled=false.
    -->
    <script src="./auth-shell.js"></script>
    <!-- RemBeetle: keeps Rem framed like a webcam (moves the loaded model down; fail-open). -->
    <script src="./framing.js" defer></script>
    <!--
      React bundle is loaded DYNAMICALLY by auth-shell.js after the
      Supabase session is settled, so the WebSocket wrapper already has
      the JWT when the React app calls new WebSocket(). If auth-shell.js
      fails to load, the fallback below fires after 5s.
    -->
    <script>
      window.__reactBundleLoaded = false;
      window.__loadReactBundle = function() {
        if (window.__reactBundleLoaded) return;
        window.__reactBundleLoaded = true;
        var s = document.createElement('script');
        s.type = 'module';
        s.crossOrigin = 'anonymous';
        s.src = './assets/main-nu7uwxNJ.js?v=4';
        document.head.appendChild(s);
      };
      // Fallback: if auth-shell.js fails or takes too long, load anyway after 5s
      setTimeout(window.__loadReactBundle, 5000);
    </script>
    <link rel="stylesheet" crossorigin href="./assets/main-QEkl09-0.css">
  </head>

  <body>
    <div id="root"></div>
    <script>
      // Hide the "Browser" tab (Electron-only feature, dead on web)
      // + Inject "RemBeetle Extensions" section into About tab
      new MutationObserver(function() {
        document.querySelectorAll('button').forEach(function(btn) {
          if (btn.textContent.trim() === 'Browser') btn.style.display = 'none';
        });
        // Inject extensions section after Copyright in About tab
        if (!document.getElementById('rembeetle-extensions')) {
          var copyrightEl = null;
          document.querySelectorAll('p, span, div').forEach(function(el) {
            if (el.textContent.trim().startsWith('© ') && el.textContent.indexOf('Open LLM VTuber') !== -1) {
              copyrightEl = el.closest('div');
            }
          });
          if (copyrightEl && copyrightEl.parentElement) {
            var section = document.createElement('div');
            section.id = 'rembeetle-extensions';
            section.style.cssText = 'border-top: 1px solid rgba(255,255,255,0.16); padding-top: 16px; margin-top: 16px;';
            section.innerHTML =
              '<p style="font-weight:bold; margin-bottom:4px;">RemBeetle Extensions</p>' +
              '<p style="margin-bottom:8px; opacity:0.9;">Extended by Brian Phan</p>' +
              '<ul style="padding-left:20px; margin:0; opacity:0.8; font-size:14px; line-height:1.8;">' +
              '<li>Google OAuth + Supabase JWT authentication (ES256/JWKS)</li>' +
              '<li>Per-user persistent chat history via Postgres</li>' +
              '<li>RAG long-term semantic memory (pgvector + OpenAI embeddings)</li>' +
              '<li>OWASP security middleware (CSP, rate limiting, input sanitization)</li>' +
              '<li>Multimodal vision support (camera + screen sharing)</li>' +
              '</ul>';
            copyrightEl.parentElement.appendChild(section);
          }
        }
      }).observe(document.documentElement, {childList: true, subtree: true});
    </script>
  </body>
</html>
